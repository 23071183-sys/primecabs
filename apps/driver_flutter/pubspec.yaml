name: primecabs_driver
description: PrimeCabs Driver app (Flutter, Android and iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  primecabs_core:
    path: ../../packages/primecabs_core
  primecabs_ui:
    path: ../../packages/primecabs_ui
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  http: ^1.6.0

flutter:
  uses-material-design: true
