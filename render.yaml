# Render Blueprint for PrimeCabs (https://render.com/docs/blueprint-spec).
# FREE PLAN: the API (Singapore), a Postgres database and the admin portal as a static site.
# Free limits: the API sleeps after 15 minutes idle (first request then takes ~1 minute),
# there is no disk (driver documents are stored in the database), no pre-deploy step
# (migrations and the seed run when the API starts), and Render deletes a free database
# 30 days after it is created. See docs/deploy.md for upgrading. Secrets marked `sync: false` are typed into Render's
# dashboard when the Blueprint is created; they are never stored in git.
# See docs/deploy.md for the step-by-step guide.

services:
  - type: web
    name: primecabs-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    # Install only the API workspace (skips the Expo apps), then compile TypeScript.
    buildCommand: npm ci --workspace=@primecabs/api --include-workspace-root --include=dev && npm -w @primecabs/api run build
    # Free plan has no pre-deploy step: apply migrations and the idempotent seed, then start.
    startCommand: npm -w @primecabs/api run db:deploy && npm -w @primecabs/api run db:seed && npm -w @primecabs/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # staging: fake SMS and payments allowed, sign-in codes are returned to the app.
      # Switch to production only after MSG91 and Razorpay are configured.
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: primecabs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # No disk on the free plan, so documents live in the database (stored_files table).
      - key: STORAGE_PROVIDER
        value: database
      # The admin portal's public address. (Render's fromService "host" is the internal
      # name, not the public one, so the address is written out. Change it if Render
      # gives the site a different name, or when a custom domain is added.)
      - key: CORS_ORIGINS
        value: https://primecabs-admin.onrender.com
      - key: SMS_PROVIDER
        value: fake
      - key: PAYMENT_PROVIDER
        value: fake
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # true = also create the demo drivers, ride, customer and staff accounts
      - key: SEED_DEMO
        value: "true"
      # Filled in later, when the accounts exist:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false

  - type: web
    name: primecabs-admin
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci --workspace=@primecabs/admin --include-workspace-root --include=dev && npm -w @primecabs/admin run build
    staticPublishPath: ./apps/admin/dist
    pullRequestPreviewsEnabled: false
    routes:
      # Single-page app: every path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The API's public address, baked into the build (see CORS_ORIGINS above for why).
      - key: VITE_API_URL
        value: https://primecabs-api.onrender.com

databases:
  - name: primecabs-db
    region: singapore
    plan: free
    databaseName: primecabs
    user: primecabs
    postgresMajorVersion: "17"
    # Reachable only from Render services, not the public internet.
    ipAllowList: []
